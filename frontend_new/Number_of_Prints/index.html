<!-- 인화할 사진 수량(2~4장)을 고르는 화면.
     ★ 새 디자인(Sub_사진 수량 선택_pik-cha.svg)을 배경(bg.svg)으로 그대로 쓰고,
     그 위에 숫자/-버튼/+버튼/BACK/NEXT만 실제 동작하는 요소로 얹는다.
     bg.svg는 원본에서 숫자("2")와 -/+ 아이콘만 빼서 만든 정적 배경이다
     (숫자는 바뀌어야 하고, -/+ 아이콘은 한계값에서 숨겨져야 하기 때문). -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Number of Prints</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="viewport">
    <div class="stage">
      <img class="stage-bg" src="bg.svg" alt="">

      <span class="count" id="count">2</span>

      <button class="dot-btn minus-btn" id="minusBtn" aria-label="수량 감소">
        <img src="Elements/minus.svg" alt="">
      </button>
      <button class="dot-btn plus-btn" id="plusBtn" aria-label="수량 증가">
        <img src="Elements/plus.svg" alt="">
      </button>

      <button class="hit-btn back-btn" id="backBtn" aria-label="이전"></button>
      <button class="hit-btn next-btn" id="nextBtn" aria-label="다음"></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
