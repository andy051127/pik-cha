<!-- 모바일 웨이팅 상태조회 화면 (등록 완료 후 자기 순번/인화상태 확인).
     HTML/CSS 스캐폴드 - 표시값(순번, 대기팀 수 등)은 예시 값이고 나중에 API로 채움. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>웨이팅 상태조회</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <p class="brand">PHOTO<br>BOOTH</p>
    <p class="subtitle">WAITING LIST</p>
    <img class="logo" src="../assets/logo-wordmark-white.png" alt="Pik-Cha!">
  </header>

  <main class="content">
    <section class="card">
      <div class="card-label">입장 순서</div>
      <div class="card-body">
        <p class="ticket-number"><strong>4</strong> 번</p>
        <p class="ticket-detail">컴퓨터소프트웨어과 · 이경환 · 4명</p>
        <p class="ticket-wait">앞에 3팀 · 예상 대기 12분</p>
      </div>
    </section>

    <section class="card">
      <div class="card-label">인화 상태</div>
      <div class="card-body">
        <p class="print-status">촬영 후 사진 인화 상태가 표시됩니다</p>
      </div>
    </section>

    <p class="refresh-hint">
      새로고침하여 실시간 순번을 확인해주세요<br>
      이 화면을 닫지 말고 대기해주세요
    </p>

    <button type="button" class="cancel-btn">웨이팅 취소하기</button>
  </main>
</body>
</html>
