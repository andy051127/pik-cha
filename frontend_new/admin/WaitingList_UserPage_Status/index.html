<!-- 모바일 웨이팅 상태조회 화면 (등록 완료 후 자기 순번/인화상태 확인). -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>웨이팅 상태조회</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <p class="brand">PHOTO<br>BOOTH</p>
    <p class="subtitle">WAITING LIST</p>
    <img class="logo" src="../assets/logo-wordmark-white.png" alt="Pik-Cha!">
  </header>

  <main class="content">
    <section class="card">
      <div class="card-label">입장 순서</div>
      <div class="card-body">
        <p class="ticket-number"><strong id="ticketNumber">-</strong> 번</p>
        <p class="ticket-detail" id="ticketDetail">불러오는 중...</p>
        <p class="ticket-wait" id="ticketWait"></p>
      </div>
    </section>

    <section class="card">
      <div class="card-label">인화 상태</div>
      <div class="card-body">
        <p class="print-status" id="printStatus">촬영 후 사진 인화 상태가 표시됩니다</p>
      </div>
    </section>

    <p class="error-msg" id="errorMsg"></p>

    <p class="refresh-hint">
      10초마다 자동으로 순번을 새로고침합니다<br>
      이 화면을 닫지 말고 대기해주세요
    </p>

    <button type="button" class="cancel-btn" id="cancelBtn">웨이팅 취소하기</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
