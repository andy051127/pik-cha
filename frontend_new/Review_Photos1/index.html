<!DOCTYPE html>
<html lang="ko">
<!-- 촬영본(최대 8장) 중 인화할 4장을 고르는 화면 (★ 데모 전용 버전).
     로직/데모 사진 생성은 script.js 참고. 여기서는 화면 규격만:
     왼쪽 액자는 Review_Photos(비-1)와 동일한 2x2 구조 + 실제 프레임 오버레이,
     각 슬롯은 175.5 : 241.8 세로 비율(w=190.22 -> h=262.11)로 통일한다. -->
<head>
<meta charset="UTF-8">
<title>Review Photos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <svg class="board-svg" viewBox="0 0 1342 877" xmlns="http://www.w3.org/2000/svg">
      <rect width="1342" height="877" fill="white"/>
      <!-- ★ 타이틀: 화면 전체 중앙이 아니라 우측 4x2 그리드 영역의 상단 중앙에 배치 -->
      <text x="933" y="165" text-anchor="middle" font-size="30" font-weight="600" fill="#181818">사진을 선택해 주세요!</text>

      <!-- Board: 실제 네컷 프레임 이미지(white_logo3.png)와 같은 비율(466 x 680.12).
           2x2로 사진을 배치하고 그 위에 실제 프레임 오버레이 이미지를 그대로 씌운다. -->
      <rect x="60" y="110" width="466" height="680.12" fill="white" stroke="black"/>

      <!-- 왼쪽 4칸(2x2): 선택한 순서대로 사진이 채워짐.
           ★ 각 슬롯을 정확히 175.5 : 241.8 세로 비율로 통일 (w=190.22 -> h=262.11).
             preserveAspectRatio="xMidYMid meet"로 두어 세로 촬영본이 잘리지 않고
             온전히 들어가게 한다. -->
      <g class="frame-slots">
        <g class="frame-slot" data-slot="0">
          <rect class="frame-bg" x="93.88" y="212.56" width="190.22" height="262.11" fill="#D9D9D9"/>
          <image class="frame-img" x="93.88" y="212.56" width="190.22" height="262.11" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="frame-slot" data-slot="1">
          <rect class="frame-bg" x="301.48" y="212.56" width="190.22" height="262.11" fill="#D9D9D9"/>
          <image class="frame-img" x="301.48" y="212.56" width="190.22" height="262.11" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="frame-slot" data-slot="2">
          <rect class="frame-bg" x="93.88" y="483.51" width="190.22" height="262.11" fill="#D9D9D9"/>
          <image class="frame-img" x="93.88" y="483.51" width="190.22" height="262.11" preserveAspectRatio="xMidYMid meet"/>
        </g>
        <g class="frame-slot" data-slot="3">
          <rect class="frame-bg" x="301.48" y="483.51" width="190.22" height="262.11" fill="#D9D9D9"/>
          <image class="frame-img" x="301.48" y="483.51" width="190.22" height="262.11" preserveAspectRatio="xMidYMid meet"/>
        </g>
      </g>

      <!-- 프레임 오버레이: Select_Frame이 실제로 쓰는 완성본 프레임 이미지
           (테두리+로고, 사진 칸은 투명하게 뚫려있음)를 사진들 "위에" 덮어씌운다. -->
      <image class="frame-overlay" x="60" y="110" width="466" height="680.12"
             href="../Select_Frame/assets/frames_full/white_logo3.png"
             preserveAspectRatio="none"/>

      <!-- 오른쪽 8칸: 촬영본 선택 영역. 내용은 비어있고,
           script.js가 데모 사진 8장으로 이 안을 채운다. -->
      <g class="photo-options" id="photoOptions"></g>

      <!-- NEXT 버튼: 정확히 4장을 골라야 클릭 가능해진다(script.js) -->
      <g id="nextBtn" class="next-btn">
        <rect x="1132.5" y="783.5" width="166" height="47" rx="23.5" fill="white" stroke="#181818"/>
        <text x="1215" y="813" text-anchor="middle" font-size="21" font-weight="600" fill="#181818">NEXT</text>
        <path d="M1265 807L1253 800.072L1253 813.928L1265 807Z" fill="#181818"/>
      </g>
    </svg>
  </div>

  <script src="script.js"></script>
</body>
</html>
