<!-- 실제 촬영 화면.
     ★ 캐논 DSLR 백엔드 연동 버전: 왼쪽 영역엔 웹캠(<video>) 대신
     백엔드 웹소켓이 스트리밍하는 라이브뷰 프레임을 <img>로 표시한다.

     ★ 세로형 디자인으로 변경 (첨부 시안 기준):
       - 라이브뷰(회색 영역)를 review_photo 프레임 슬롯과 동일한
         세로 비율(175.5 : 241.8 ≈ 1 : 1.378)로 맞춤.
       - 좌측에 세로형 라이브뷰, 우측에 [촬영 횟수] / 구분선 / [남은 시간]
         을 세로로 정렬 (flex 레이아웃).
     로직(카운트다운/촬영 횟수)은 전부 script.js에 있고 그대로 유지된다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Take a Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="shoot-layout">
      <!-- ★ 세로형 라이브뷰. 백엔드가 웹소켓으로 보내주는 base64 JPEG
           프레임을 script.js가 여기 src로 계속 갱신한다.
           비율은 CSS(aspect-ratio: 175.5 / 241.8)로 고정한다. -->
      <div class="camera-wrap">
        <img id="camera" class="camera-feed" alt="라이브뷰" />
        <!-- 촬영 순간 화면을 하얗게 번쩍이는 플래시 효과용 오버레이 -->
        <div class="flash-overlay" id="flashOverlay"></div>
      </div>

      <!-- 우측 패널: 촬영 횟수(위) / 구분선 / 남은 시간(아래) -->
      <div class="panel">
        <div class="panel-item">
          <span class="panel-label">촬영 횟수</span>
          <span class="shot-count">
            <span id="shotCurrent">1</span>/<span id="shotTotal">8</span>
          </span>
        </div>
        <div class="divider"></div>
        <div class="panel-item">
          <span class="panel-label">남은 시간</span>
          <span class="countdown" id="countdown">5</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ★ captureCanvas 없음: 브라우저에서 프레임을 캡처하지 않는다.
       실제 촬영본은 서버가 카메라에서 직접 다운로드해서 저장하며,
       review_photo 프레임 슬롯 비율(175.5 : 241.8)로 중앙 크롭되도록
       script.js가 start 요청에 aspect 값을 함께 보낸다. -->
  <script src="script.js"></script>
</body>
</html>
