<!DOCTYPE html>
<html lang="ko">
<!-- 인쇄 대기 + QR 표시 화면 (흐름의 마지막 단계).
     Select_Frame이 /api/fourcut/create 호출 후 sessionStorage("pikcha_result")에
     저장해둔 결과(QR base64 등)를 읽어서 보여준다.
     30초 카운트다운 후 자동으로 Main으로 돌아가 다음 손님을 받는다. -->
<head>
<meta charset="UTF-8">
<title>Print Photo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="frame">
      <p class="title">사진을 출력 중이니 잠시만 기다려주세요!</p>

      <div class="qr-wrap">
        <img id="qrImage" class="qr-image" alt="QR 코드" />
      </div>

      <p class="subtitle">QR코드를 촬영하여 사진을 저장해 보세요!</p>
      <p class="count" id="count">30</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
