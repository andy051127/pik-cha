<!-- 실제 촬영 화면 (★ 데모 전용 버전 - 백엔드 연결 없이 항상 데모로 동작).
     로직은 script.js 참고. 여기서는 화면 규격만: review_photo 프레임 슬롯과
     동일한 세로 비율(175.5 : 241.8 ≈ 1 : 1.378) 라이브뷰를 좌측에 두고,
     우측에 [촬영 횟수] / 구분선 / [남은 시간]을 세로 정렬한다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Take a Picture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="shoot-layout">
      <!-- 세로형 라이브뷰. 데모 버전은 script.js가 여기 src에 데모 이미지를 넣는다.
           비율은 CSS(aspect-ratio: 175.5 / 241.8)로 고정한다. -->
      <div class="camera-wrap">
        <img id="camera" class="camera-feed" alt="라이브뷰" />
        <!-- 촬영 순간 화면을 하얗게 번쩍이는 플래시 효과용 오버레이 -->
        <div class="flash-overlay" id="flashOverlay"></div>
      </div>

      <!-- 우측 패널: 촬영 횟수(위) / 구분선 / 남은 시간(아래) -->
      <div class="panel">
        <div class="panel-item">
          <span class="panel-label">촬영 횟수</span>
          <span class="shot-count">
            <span id="shotCurrent">1</span>/<span id="shotTotal">8</span>
          </span>
        </div>
        <div class="divider"></div>
        <div class="panel-item">
          <span class="panel-label">남은 시간</span>
          <span class="countdown" id="countdown">5</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
