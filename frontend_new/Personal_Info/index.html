<!-- 웨이팅리스트에서 발급받은 순번을 입력받는 화면 (구 Personal_Info).
     순번 조회가 성공해야 NEXT가 활성화된다(script.js에서 서버 검증). -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Ticket Number</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="content">
      <p class="title">발급받은 순번을 입력해주세요.</p>

      <!-- 순번 입력: 숫자만 -->
      <div class="field">
        <label for="ticketInput" class="field-label">순번 [Ticket Number]</label>
        <input type="text" id="ticketInput" class="pill-input" placeholder="예: 12" inputmode="numeric" maxlength="6">
      </div>

      <!-- 조회 실패(등록되지 않은 순번 등) 메시지 표시용 -->
      <p class="error-msg" id="errorMsg"></p>
    </div>

    <!-- NEXT는 순번 조회가 성공했을 때만 클릭 가능(disabled 속성은 script.js가 토글) -->
    <div class="nav">
      <button class="nav-btn back-btn" id="backBtn" aria-label="이전">
        <img src="Elements/back.svg" alt="BACK">
      </button>
      <button class="nav-btn next-btn" id="nextBtn" aria-label="다음" disabled>
        <img src="Elements/next.svg" alt="NEXT">
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
