<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1342">
  <title>PIK-CHA! - 관리자</title>
  <!-- 공통 스타일(admin.css) → 이 화면 전용 스타일 순서. ?v= 는 파일을 고칠 때마다 올린다(브라우저 캐시 방지) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../admin.css?v=13">
  <link rel="stylesheet" href="style.css?v=13">
  <!-- three.js (3D 카메라 모델, camera.js 에서 사용) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!--
    관리자 화면 (Figma 6:219 의 WaitingList_AdminPage 프레임 3개, 1342 x 877)
    왼쪽 = 핸드폰(홈 화면 위젯), 오른쪽 = 브라우저 창. 주소의 해시(#)로 화면을 바꾼다.
      · #home    (57:596) : 핸드폰만 보이고 오른쪽은 비어 있다       ← 로고 위젯
      · #waiting (57:322) : 오른쪽에 "웨이팅 리스트" 관리 웹페이지    ← 웨이팅 리스트 위젯 / 탭
      · #print   (57:750) : 오른쪽에 "사진 인화 관리" 웹페이지        ← 사진 인화 관리 위젯 / 탭
    현재 화면은 .stage 의 data-view 속성(home | waiting | print)에 들어 있다.
    JS 연결 지점
      · #phone-waiting / #phone-visitors : 핸드폰 "현재 대기 팀" / "누적 방문객" 숫자
      · #date-weekday / #date-day        : 날짜 위젯 (오늘 날짜)
      · #btn-reload                      : 브라우저 새로고침 버튼 (지금 보이는 표를 다시 불러온다)
      · #status-msg                      : 오류/안내 문구 (평소엔 hidden)
      · #sum-waiting / #sum-entered      : 웨이팅 요약 카드 (현재 대기 / 입장 완료)
      · #sum-print-today / #sum-print-total : 인화 요약 카드 (오늘 / 누적 인화 수)
      · #waitlist-body / #print-body     : 표 본문
  -->
  <main class="stage" data-screen="admin" data-view="home">

    <!-- ── 왼쪽: 핸드폰 ───────────────────────────────────────────── -->
    <aside class="phone-side">
      <!-- 핸드폰 위 PIK-CHA! 로고 -->
      <img class="side-logo" src="../assets/phone/pikcha-third.svg" alt="PIK-CHA!">
      <!-- 화면: 배경 사진 → 흐림 막 → 스포티파이 위젯(화면 밖은 잘림) -->
      <div class="screen" aria-hidden="true">
        <div class="wallpaper"></div>
        <div class="frost"></div>
        <div class="music">
          <img class="art" src="../assets/phone/album-adela.jpg" alt="">
          <span class="song">Ain’t In LA</span>
          <span class="artist">ADÉLA</span>
          <span class="play"><img src="../assets/phone/icon-play.svg" alt=""></span>
          <img class="spotify" src="../assets/phone/spotify_logo.png" alt="">
        </div>
      </div>
      <!-- 아이폰 테두리(상태바 · 다이내믹 아일랜드 포함) -->
      <img class="device-frame" src="../assets/phone/iphone-frame.png" alt="" aria-hidden="true">

      <!-- 로고 위젯: 처음(핸드폰만 있는) 화면으로 -->
      <a class="widget w-logo" href="#home" aria-label="처음 화면으로">
        <img src="../assets/phone/pikcha-logo.svg" alt="PIK-CHA!">
      </a>

      <!-- 날짜 위젯 -->
      <div class="widget w-date">
        <span class="weekday" id="date-weekday">목요일</span>
        <strong class="day" id="date-day">22</strong>
        <span class="event">이벤트</span>
        <span class="chip chip-expo"><i><img src="../assets/phone/icon-calendar.svg" alt=""></i>2026 신구 EXPO</span>
        <span class="chip chip-pikcha"><i><img src="../assets/phone/icon-flower.svg" alt=""></i>PIK-CHA!</span>
      </div>

      <!-- 웨이팅 리스트 위젯 -->
      <a class="widget w-wide w-waiting" href="#waiting">
        <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span class="w-title">웨이팅 리스트</span>
        <span class="go" aria-hidden="true"><img src="../assets/phone/icon-waiting.svg" alt=""></span>
      </a>

      <!-- 사진 인화 관리 위젯 -->
      <a class="widget w-wide w-print" href="#print">
        <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span class="w-title">사진 인화 관리</span>
        <span class="go" aria-hidden="true"><img src="../assets/phone/icon-image.svg" alt=""></span>
      </a>

      <!-- 현재 대기 팀 / 누적 방문객 -->
      <div class="widget w-stat w-now">
        <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span class="w-title">현재 대기 팀</span>
        <span class="num"><b id="phone-waiting">-</b>팀</span>
      </div>
      <div class="widget w-stat w-visitors">
        <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span class="w-title">누적 방문객</span>
        <span class="num"><b id="phone-visitors">-</b>명</span>
      </div>
    </aside>

    <!-- ── 오른쪽: #home = 3D 카메라 모델 / #waiting · #print = 브라우저 창 ── -->
    <section class="web-side">
      <!-- #home 전용: 마우스를 따라 기우는 3D 카메라 (camera.js 가 <canvas> 를 넣는다) -->
      <div class="camera-stage" id="camera-stage" aria-hidden="true"></div>

      <div class="browser">
        <!-- 탭 줄 -->
        <div class="tabbar">
          <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="tab-menu" aria-hidden="true"></span>
          <a class="tab tab-waiting" href="#waiting">
            <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span>웨이팅 리스트</span>
          </a>
          <a class="tab-close tab-close-waiting" href="#home" aria-label="웨이팅 리스트 탭 닫기"></a>
          <a class="tab tab-print" href="#print">
            <img class="ic" src="../assets/phone/pikcha-mark.svg" alt=""><span>사진 인화 관리</span>
          </a>
          <a class="tab-close tab-close-print" href="#home" aria-label="사진 인화 관리 탭 닫기"></a>
          <span class="tab-sep" aria-hidden="true"></span>
          <span class="tab-new" aria-hidden="true"></span>
        </div>

        <!-- 도구 줄: 뒤로 · 앞으로 · 새로고침 · 주소창 · 프로필 · 메뉴 -->
        <div class="toolbar">
          <a class="nav nav-back" href="#home" aria-label="처음 화면으로">
            <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M13 6H1M6.143 1L1 6L6.143 11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <span class="nav nav-fwd" aria-hidden="true">
            <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M1 6H13M7.857 1L13 6L7.857 11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <button type="button" class="nav nav-reload" id="btn-reload" aria-label="새로고침">
            <img src="../assets/phone/icon-reload.svg" alt="">
          </button>
          <div class="address">
            <i class="site"></i>
            <img class="star" src="../assets/phone/icon-star.svg" alt="">
          </div>
          <img class="profile" src="../assets/phone/profile.jpg" alt="관리자">
          <span class="more" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>

        <!-- 내용 -->
        <div class="content">
          <p class="status-msg" id="status-msg" hidden></p>

          <!-- 웨이팅 리스트 (57:322) -->
          <div class="pane pane-waiting">
            <div class="card summary summary-dark">
              <div class="sum">
                <span class="sum-label">현재 대기</span>
                <span class="sum-num"><b id="sum-waiting">-</b>팀</span>
              </div>
              <div class="sum sum-right">
                <span class="sum-label">입장 완료</span>
                <span class="sum-num"><b id="sum-entered">-</b>팀</span>
              </div>
            </div>
            <div class="card table-card">
              <table class="list-table waiting-table">
                <colgroup>
                  <col style="width:87px"><col style="width:119px"><col style="width:70px"><col style="width:54px">
                  <col style="width:116px"><col style="width:95px"><col style="width:162px"><col style="width:51px">
                </colgroup>
                <thead>
                  <tr><th>입장번호</th><th>학과</th><th>이름</th><th>인원</th><th>전화번호</th><th>상태</th><th>등록시간</th><th></th></tr>
                </thead>
                <tbody id="waitlist-body">
                  <tr><td colspan="8" class="empty-row">불러오는 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 사진 인화 관리 (57:750) -->
          <div class="pane pane-print">
            <div class="card summary summary-half">
              <div class="sum">
                <span class="sum-label">오늘 인화 수</span>
                <span class="sum-num"><b id="sum-print-today">-</b>팀</span>
              </div>
            </div>
            <div class="card summary summary-half summary-half-2">
              <div class="sum">
                <span class="sum-label">누적 인화 수</span>
                <span class="sum-num"><b id="sum-print-total">-</b>팀</span>
              </div>
            </div>
            <div class="card table-card">
              <table class="list-table print-table">
                <colgroup>
                  <col style="width:82px"><col style="width:140px"><col style="width:48px"><col style="width:113px">
                  <col style="width:37px"><col style="width:69px"><col style="width:64px"><col style="width:77px"><col style="width:124px">
                </colgroup>
                <thead>
                  <tr><th>입장번호</th><th>세션</th><th>이름</th><th>전화번호</th><th>매수</th><th>인화상태</th><th>SMS</th><th>생성시각</th><th></th></tr>
                </thead>
                <tbody id="print-body">
                  <tr><td colspan="9" class="empty-row">불러오는 중...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js?v=13"></script>
  <script type="module" src="camera.js?v=13"></script>
</body>
</html>
