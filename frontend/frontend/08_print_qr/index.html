<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIK-CHA! - 사진 출력</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    08 사진 출력 + 다운로드 QR (Figma 40:31 printingPhoto)  흐름: 07 프레임 선택 → [여기] → 01 메인(처음으로)
    JS 연결 지점
      · #download-qr  : 사진 원본 다운로드용 QR 이미지. 지금은 샘플 PNG(assets/qr-sample.png). 실제 QR 로 src 를 교체한다
      · #print-timer  : 남은 초 카운트(시안 값 30). 0 이 되면 01 로 돌아간다
  -->
  <main class="stage" data-screen="print-qr">
    <img class="deco deco-pink" src="../assets/deco-circle-pink.svg" alt="" width="440" height="440">
    <img class="deco deco-yellow" src="../assets/deco-circle-yellow.svg" alt="" width="336" height="336">
    <header class="top-bar"><img class="top-logo" src="../assets/logo-header.svg" alt="PIK-CHA!" width="58" height="24"></header>

    <div class="content">
      <h1 class="title">사진을 출력 중이니 잠시만 기다려주세요!</h1>
      <img class="qr" id="download-qr" src="../assets/qr-sample.png" alt="다운로드 QR 코드">
      <p class="count" id="print-timer">30</p>
      <p class="hint">QR코드를 촬영하여 사진을 저장해 보세요!</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
