<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIK-CHA! - 사진 수량 선택</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    JS 연결 지점
      · #print-count                : 현재 수량 숫자 (시안 값 2, 허용 범위 2~4)
      · [data-action="decrease"]    : − 버튼 (수량 줄이기)
      · [data-action="increase"]    : + 버튼 (수량 늘리기)
      · 범위 끝에 닿으면 해당 버튼에 .disabled 를 붙이면 된다
      · #nav-next                   : "확인하고 계속하기"
  -->
  <main class="stage" data-screen="number-of-prints">
    <img class="deco deco-pink" src="../assets/deco-circle-pink.svg" alt="" width="440" height="440">
    <img class="deco deco-yellow" src="../assets/deco-circle-yellow.svg" alt="" width="336" height="336">
    <header class="top-bar"><img class="top-logo" src="../assets/logo-header.svg" alt="PIK-CHA!" width="58" height="24"></header>

    <div class="content">
      <h1 class="title">사진 수량을 선택해 주세요</h1>

      <!-- 원형 − / 큰 숫자 / 원형 + -->
      <div class="counter">
        <a class="round" data-action="decrease" href="#" aria-label="수량 줄이기"><img src="assets/minus.svg" alt="" width="80" height="80"></a>
        <p class="count" id="print-count">2</p>
        <a class="round" data-action="increase" href="#" aria-label="수량 늘리기"><img src="assets/plus.svg" alt="" width="80" height="80"></a>
      </div>

      <a class="cta" id="nav-next" href="../04_countdown/index.html">확인하고 계속하기</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
