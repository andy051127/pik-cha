<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIK-CHA! - 순번 입력</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    02 순번 입력 (Figma 40:516 waitingNum)  흐름: 01 메인 → [여기] → 03 수량 선택
    JS 연결 지점
      · #keypad            : 숫자 키패드 전체
      · [data-key]         : 각 키의 값 "0"~"9", "clear"(지우기: 전체 삭제), "backspace"(삭제: 한 글자)
      · #number-line       : 입력한 순번이 표시되는 자리 (Figma 시안에는 없는 요소. 안내 문구와 키패드 사이)
      · #error-msg         : 오류/진행 메시지
      · #nav-next          : "확인하고 계속하기" (순번이 비어 있으면 .disabled → 회색)
  -->
  <main class="stage" data-screen="waiting-number">
    <img class="deco deco-pink" src="../assets/deco-circle-pink.svg" alt="" width="440" height="440">
    <img class="deco deco-yellow" src="../assets/deco-circle-yellow.svg" alt="" width="336" height="336">

    <div class="content">
      <h1 class="title">웨이팅 번호를 입력해 주세요</h1>
      <p class="sub">등록 시 받은 번호에요</p>

      <!-- 입력된 순번 / 오류 메시지 -->
      <p class="number" id="number-line" aria-live="polite"></p>
      <p class="error" id="error-msg" role="alert" hidden></p>

      <!-- 숫자 키패드: 3열 x 4행. 마지막 줄은 지우기 / 0 / 삭제 -->
      <div class="keypad" id="keypad">
        <a class="key" data-key="1" href="#">1</a>
        <a class="key" data-key="2" href="#">2</a>
        <a class="key" data-key="3" href="#">3</a>
        <a class="key" data-key="4" href="#">4</a>
        <a class="key" data-key="5" href="#">5</a>
        <a class="key" data-key="6" href="#">6</a>
        <a class="key" data-key="7" href="#">7</a>
        <a class="key" data-key="8" href="#">8</a>
        <a class="key" data-key="9" href="#">9</a>
        <a class="key key-text" data-key="clear" href="#">지우기</a>
        <a class="key" data-key="0" href="#">0</a>
        <a class="key key-text" data-key="backspace" href="#">삭제</a>
      </div>

      <a class="cta disabled" id="nav-next" href="#">확인하고 계속하기</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
