<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIK-CHA! - 프레임 선택</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    JS 연결 지점
      · #board                         : 미리보기 보드. script.js 가 이 안에 canvas 를 넣어 그린다
      · [data-slot="1..4"]             : 보드 안 사진 자리 4칸 (script.js 가 숨긴다)
      · .sw[data-group][data-value]    : 선택 원. data-group = logo | color | special | frame
                                          그룹마다 하나만 고르므로, 고른 원에 .is-selected 를 붙인다
      · #nav-next                      : "선택 완료". 업로드 후 08 로 이동
  -->
  <main class="stage" data-screen="select-frame">
    <img class="deco deco-pink" src="../assets/deco-circle-pink.svg" alt="" width="440" height="440">
    <img class="deco deco-yellow" src="../assets/deco-circle-yellow.svg" alt="" width="336" height="336">
    <header class="top-bar"><img class="top-logo" src="../assets/logo-header.svg" alt="PIK-CHA!" width="58" height="24"></header>

    <div class="content split">
      <h1 class="title">프레임을 완성해 주세요</h1>

      <!-- 미리보기 보드 + 사진 자리 4칸 (script.js 가 사진 자리를 숨기고 canvas 를 넣는다) -->
      <div class="board" id="board">
        <div class="photo" data-slot="1"></div>
        <div class="photo" data-slot="2"></div>
        <div class="photo" data-slot="3"></div>
        <div class="photo" data-slot="4"></div>
      </div>

      <!-- 옵션 4묶음 (그룹마다 원 하나씩 고른다) -->
      <div class="options">
        <!-- ① Logo : 인화지 위에 들어갈 로고 3종 -->
        <section class="group">
          <p class="label" data-label="logo">Logo</p>
          <div class="swatches">
            <a class="sw" data-group="logo" data-value="logo-1" href="#" aria-label="로고 1"><img src="assets/logo-3.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="logo" data-value="logo-2" href="#" aria-label="로고 2"><img src="assets/logo-2.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="logo" data-value="logo-3" href="#" aria-label="로고 3"><img src="assets/logo-1.svg" alt="" width="78" height="78"></a>
          </div>
        </section>

        <!-- ② Photo Color : 사진 색감 (컬러 / 흑백) -->
        <section class="group">
          <p class="label" data-label="color">Photo Color</p>
          <div class="swatches">
            <a class="sw" data-group="color" data-value="rainbow" href="#" aria-label="컬러"><img src="assets/color-1.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="color" data-value="bw" href="#" aria-label="흑백"><img src="assets/color-2.svg" alt="" width="78" height="78"></a>
          </div>
        </section>

        <!-- ③ Special Frame : 무늬가 있는 특별 프레임 6종 -->
        <section class="group">
          <p class="label" data-label="special">Special Frame</p>
          <div class="swatches">
            <a class="sw" data-group="special" data-value="special-1" href="#" aria-label="스페셜 1"><img src="assets/special-1.png" alt="" width="78" height="78"></a>
            <a class="sw" data-group="special" data-value="special-2" href="#" aria-label="스페셜 2"><img src="assets/special-2.png" alt="" width="78" height="78"></a>
            <a class="sw" data-group="special" data-value="special-3" href="#" aria-label="스페셜 3"><img src="assets/special-3.png" alt="" width="78" height="78"></a>
            <a class="sw" data-group="special" data-value="special-4" href="#" aria-label="스페셜 4"><img src="assets/special-4.png" alt="" width="78" height="78"></a>
            <a class="sw" data-group="special" data-value="special-5" href="#" aria-label="스페셜 5"><img src="assets/special-5.png" alt="" width="78" height="78"></a>
            <a class="sw" data-group="special" data-value="special-6" href="#" aria-label="스페셜 6"><img src="assets/special-6.png" alt="" width="78" height="78"></a>
          </div>
        </section>

        <!-- ④ Frame : 단색 프레임 4종 + 신구대 로고 프레임 -->
        <section class="group">
          <p class="label" data-label="frame">Frame</p>
          <div class="swatches">
            <a class="sw" data-group="frame" data-value="frame-white" href="#" aria-label="흰색"><img src="assets/frame-1.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="frame" data-value="frame-black" href="#" aria-label="검정"><img src="assets/frame-2.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="frame" data-value="frame-blue" href="#" aria-label="파랑"><img src="assets/frame-3.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="frame" data-value="frame-pink" href="#" aria-label="분홍"><img src="assets/frame-4.svg" alt="" width="78" height="78"></a>
            <a class="sw" data-group="frame" data-value="frame-shingu" href="#" aria-label="신구"><img src="assets/frame-5.png" alt="" width="78" height="78"></a>
          </div>
        </section>
      </div>

      <a class="cta cta-sm" id="nav-next" href="#">선택 완료</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
