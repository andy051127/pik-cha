<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIK-CHA! - 사진 선택</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    06 사진 선택 (Figma 40:58 choosePhoto)  흐름: 05 촬영 → [여기] → 07 프레임 선택
    8장을 찍고, 그중 4장을 골라 4컷 보드를 채우는 화면이다.
    JS 연결 지점
      · #board                : 4컷 보드(흰 종이)
      · [data-slot="1..4"]    : 보드 안의 사진 자리 4칸 (고른 사진을 순서대로 채운다)
      · [data-photo="1..8"]   : 썸네일 8개 (눌러서 선택). 선택된 칸에는 .is-selected 를 붙인다
      · #nav-next             : "선택 완료". 4장을 다 골랐을 때만 활성화 (.disabled → 회색)
  -->
  <main class="stage" data-screen="review-photo">
    <img class="deco deco-pink" src="../assets/deco-circle-pink.svg" alt="" width="440" height="440">
    <img class="deco deco-yellow" src="../assets/deco-circle-yellow.svg" alt="" width="336" height="336">
    <header class="top-bar"><img class="top-logo" src="../assets/logo-header.svg" alt="PIK-CHA!" width="58" height="24"></header>

    <div class="content split">
      <h1 class="title">마음에 드는 사진을 골라주세요</h1>

      <!-- 4컷 보드(흰 종이) + 사진 자리 4칸 (2열 x 2행) -->
      <div class="board" id="board">
        <div class="photo" data-slot="1"></div>
        <div class="photo" data-slot="2"></div>
        <div class="photo" data-slot="3"></div>
        <div class="photo" data-slot="4"></div>
      </div>

      <!-- 촬영한 8장의 썸네일 (4열 x 2행). 눌러서 고른다 -->
      <div class="thumbs">
        <a class="photo thumb" data-photo="1" href="#" aria-label="사진 1"></a>
        <a class="photo thumb" data-photo="2" href="#" aria-label="사진 2"></a>
        <a class="photo thumb" data-photo="3" href="#" aria-label="사진 3"></a>
        <a class="photo thumb" data-photo="4" href="#" aria-label="사진 4"></a>
        <a class="photo thumb" data-photo="5" href="#" aria-label="사진 5"></a>
        <a class="photo thumb" data-photo="6" href="#" aria-label="사진 6"></a>
        <a class="photo thumb" data-photo="7" href="#" aria-label="사진 7"></a>
        <a class="photo thumb" data-photo="8" href="#" aria-label="사진 8"></a>
      </div>

      <a class="cta cta-sm disabled" id="nav-next" href="#">선택 완료</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
