<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1342">
  <title>PIK-CHA! - 웨이팅 등록 (태블릿)</title>
  <link rel="stylesheet" href="../admin.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    태블릿 QR + 웨이팅 등록 (Figma 1:425  WaitingList_AdminQRPage, 1342 x 877)
    왼쪽 코랄 패널(QR · 현재 대기 팀 수)과 오른쪽 등록 폼으로 나뉜다. 모바일 등록 폼과 같은 항목에 학번·전화번호가 더해졌다.
    JS 연결 지점
      · #download-qr / .qr  : 등록용 QR 이미지 (지금은 샘플 PNG. 실제 QR 로 교체)
      · #waiting-now        : 왼쪽 패널의 현재 대기 팀 수 "00" (시안 값 00)
      · #dept / #sid / #name / #phone : 학과(드롭다운) · 학번 · 이름 · 전화번호
      · #head-count         : 인원수 숫자 (시안 값 2, 허용 범위 1~8)
      · [data-action="decrease"] / [data-action="increase"] : 인원수 −/+ 버튼
      · #btn-register       : 등록 버튼. 시안은 회색(비활성) 상태 — 필수 입력이 끝나면 활성화한다
    ※ 폼 태그(<form>)는 쓰지 않았다. 제출은 JS 에서 #btn-register 클릭으로 처리한다.
  -->
  <main class="stage" data-screen="tablet-register">
    <!-- 왼쪽 코랄 패널 520 x 877: 로고 → QR 카드 → 안내 → 현재 대기 팀 수 -->
    <aside class="panel">
      <img class="logo" src="../../assets/logo-white.svg" alt="PIK-CHA!">
      <div class="qr-card"></div>                    <!-- QR 뒤의 흰 둥근 카드 -->
      <img class="qr" id="download-qr" src="../../assets/qr-sample.png" alt="웨이팅 등록 QR 코드">
      <p class="guide">QR을 찍거나 웨이팅을 등록하면<br>입장과 인화 상태를 알려드려요</p>
      <p class="now">현재 대기</p>
      <p class="num" id="waiting-now">00</p>
      <p class="team">팀</p>
    </aside>

    <!-- 오른쪽 등록 폼 -->
    <div class="form">
      <!-- 학과: 드롭다운 + 오른쪽 ▼ -->
      <label class="t lb" for="dept">학과</label>
      <select class="field" id="dept" name="dept" autocomplete="off">
        <option>컴퓨터소프트웨어과</option>
      </select>
      <i class="tri big"></i>

      <!-- 학번 / 이름 / 전화번호 -->
      <label class="t lb" for="sid">학번</label>
      <input class="field" id="sid" name="studentId" type="text" inputmode="numeric" placeholder="학번을 입력하세요" autocomplete="off">

      <label class="t lb" for="name">이름</label>
      <input class="field" id="name" name="name" type="text" placeholder="이름을 입력하세요" autocomplete="off">

      <label class="t lb" for="phone">전화번호</label>
      <input class="field" id="phone" name="phone" type="tel" placeholder="전화번호를 입력하세요" autocomplete="off">

      <!-- 인원수: [ − ]  2 명  [ + ] -->
      <label class="t lb lb-count">인원수</label>
      <div class="count-box">
        <a class="btn-minus" data-action="decrease" href="#" aria-label="인원 줄이기"></a>
        <p class="num2" id="head-count">2</p><p class="unit">명</p>
        <a class="btn-plus" data-action="increase" href="#" aria-label="인원 늘리기"></a>
      </div>
      <p class="t note">최대 8명까지 촬영 가능합니다</p>
    </div>

    <!-- 등록 버튼 (시안은 회색 비활성 상태, 아직 이동할 화면 없음) -->
    <p id="error-msg" role="alert" hidden style="position:absolute;left:557px;top:703px;width:751px;color:#b04a3a;font-size:16px"></p>
    <a class="pill submit" id="btn-register" href="#">웨이팅 등록하기</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
