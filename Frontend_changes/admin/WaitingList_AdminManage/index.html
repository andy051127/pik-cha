<!-- =====================================================================
     웨이팅리스트 관리 (관리자)  —  WaitingList_AdminManage 구조 기반, 색만 코랄로 변경
     · 순수 HTML/CSS (JS 없음). 표 본문(#waitlist-body)은 나중에 JS 가 행(<tr>)을 채운다.
     · 행 하나 = 대기 1팀. 열: 순번 · 학과 · 이름 · 인원 · 전화번호 · 상태 · 등록시각 · (취소 버튼)
       - 상태는 <span class="status-pill status-값"> (값: waiting|called|in_session|photographed|completed|canceled)
       - 마지막 칸에는 <button class="cancel-btn"> (이미 끝난 팀은 disabled)
     [JS 훅]  #btn-refresh(새로고침)  #status-msg(오류 문구, 평소엔 hidden)  #waitlist-body(표 본문)
     ===================================================================== -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIK-CHA! - 웨이팅리스트 관리</title>
<link rel="stylesheet" href="../list.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 바: 대시보드로 돌아가기 · 제목 · 새로고침 -->
  <div class="topbar">
    <a href="../WaitingList_AdminPage/index.html" class="back-link">← 대시보드</a>
    <h1>웨이팅리스트 관리</h1>
    <a href="#" class="refresh-btn" id="btn-refresh">새로고침</a>
  </div>

  <!-- 오류/안내 문구 (예: 인증 실패). 쓸 때 hidden 만 지우면 된다 -->
  <p class="status-msg" id="status-msg" hidden>인증에 실패했습니다. 다시 로그인해주세요.</p>

  <table class="list-table">
    <thead>
      <tr>
        <th>순번</th>
        <th>학과</th>
        <th>이름</th>
        <th>인원</th>
        <th>전화번호</th>
        <th>상태</th>
        <th>등록시각</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="waitlist-body">
      <tr><td colspan="8" class="empty-row">불러오는 중...</td></tr>
    </tbody>
  </table>
  <script src="script.js"></script>
</body>
</html>
