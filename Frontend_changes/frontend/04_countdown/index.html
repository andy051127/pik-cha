<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1342">
  <title>PIK-CHA! - 촬영 시작</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    04 촬영 시작 카운트다운 (Figma 1:212)  흐름: 03 수량 선택 → [여기] → 05 촬영
    JS 연결 지점
      · #countdown-number : 남은 초 숫자 (시안 값 5). 5→4→3→2→1 로 바꾸고 0 이 되면 05 로 이동
      · .goto             : 화면 전체 투명 링크. 자동 카운트다운을 구현하면 이 링크는 지운다
    ※ .five 는 글자 앞에 공백이 있다(" 5"). 숫자만 바꿀 때는 앞 공백을 유지하거나 CSS 의 left 를 조정할 것
  -->
  <main class="stage" data-screen="countdown">
    <div class="top-bar">
      <img class="logo" src="../../assets/logo-white.svg" alt="PIK-CHA!">
    </div>

    <p class="start">START</p>
    <p class="in">in </p>
    <p class="five" id="countdown-number"> 5</p>

    <!-- JS 가 없으므로 임시로: 화면을 누르면 촬영 화면으로 이동 -->
    <a class="goto" href="../05_take_a_picture/index.html" aria-label="촬영 시작"></a>
  </main>
</body>
</html>
