<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1342">
  <title>PIK-CHA! - 프레임 선택</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    07 프레임 선택 (Figma 1:304)  흐름: 06 사진 선택 → [여기] → 08 출력/QR
    왼쪽은 선택 결과를 미리 보는 4컷 보드, 오른쪽은 4가지 옵션 묶음(로고 / 사진 색 / 스페셜 프레임 / 프레임)이다.
    JS 연결 지점
      · #board                         : 미리보기 보드. 선택한 프레임(assets/frames/*.svg)을 이 위에 씌우면 된다
      · [data-slot="1..4"]             : 보드 안 사진 자리 4칸
      · .sw[data-group][data-value]    : 선택 원. data-group = logo | color | special | frame
                                          data-value 로 어떤 항목인지 구분 (예: "logo-1", "rainbow", "special-3", "frame-blue")
                                          그룹마다 하나만 고르므로, 고른 원에 .is-selected 를 붙이고 같은 그룹의 나머지에서 뗀다
      · 프레임 이미지 매핑 : special-1..6 / frame-white·black·blue·pink·shingu  ↔  assets/frames/ 의 파일
                             (예: frame-white → white-{round|arch|long}.svg, 모양 round/arch/long 은 로고 선택에 대응)
      · #nav-next                      : 선택이 끝나면 08 로 이동
  -->
  <main class="stage" data-screen="select-frame">
    <div class="top-bar">
      <img class="logo" src="../../assets/logo-white.svg" alt="PIK-CHA!">
    </div>

    <h1 class="title">프레임을 선택해 주세요!</h1>

    <!-- 왼쪽: 미리보기 보드 + 사진 자리 4칸 -->
    <div class="board" id="board"></div>
    <div class="photo" data-slot="1"></div>
    <div class="photo" data-slot="2"></div>
    <div class="photo" data-slot="3"></div>
    <div class="photo" data-slot="4"></div>

    <!-- ① Logo : 인화지 위에 들어갈 로고 3종 (원 안에 로고 그림이 들어 있는 SVG) -->
    <p class="label" data-label="logo">Logo</p>
    <a class="sw s-img" data-group="logo" data-value="logo-1" href="#" aria-label="로고 1"><img src="assets/logo-section.svg" alt=""></a>
    <a class="sw s-img" data-group="logo" data-value="logo-2" href="#" aria-label="로고 2"><img src="assets/color-section.svg" alt=""></a>
    <a class="sw s-img" data-group="logo" data-value="logo-3" href="#" aria-label="로고 3"><img src="assets/third-section.svg" alt=""></a>

    <!-- ② Photo Color : 사진 색감 (무지개 / 흑백). 색은 CSS 그라디언트로 그린 원 -->
    <p class="label" data-label="color">Photo Color</p>
    <a class="sw" data-group="color" data-value="rainbow" href="#" aria-label="무지개"></a>
    <a class="sw" data-group="color" data-value="bw"      href="#" aria-label="흑백"></a>

    <!-- ③ Special Frame : 무늬가 있는 특별 프레임 6종 (무늬 이미지가 박힌 SVG 원) -->
    <p class="label" data-label="special">Special Frame</p>
    <p class="desc">정말 특별한 사람들을 위한 프레임</p>
    <a class="sw s-img" data-group="special" data-value="special-1" href="#" aria-label="스페셜 1"><img src="assets/special-1.svg" alt=""></a>
    <a class="sw s-img" data-group="special" data-value="special-2" href="#" aria-label="스페셜 2"><img src="assets/special-2.svg" alt=""></a>
    <a class="sw s-img" data-group="special" data-value="special-3" href="#" aria-label="스페셜 3"><img src="assets/special-3.svg" alt=""></a>
    <a class="sw s-img" data-group="special" data-value="special-4" href="#" aria-label="스페셜 4"><img src="assets/special-4.svg" alt=""></a>
    <a class="sw s-img" data-group="special" data-value="special-5" href="#" aria-label="스페셜 5"><img src="assets/special-5.svg" alt=""></a>
    <a class="sw s-img" data-group="special" data-value="special-6" href="#" aria-label="스페셜 6"><img src="assets/special-6.svg" alt=""></a>

    <!-- ④ Frame : 단색 프레임 4종 + 신구대 로고 프레임 -->
    <p class="label" data-label="frame">Frame</p>
    <a class="sw" data-group="frame" data-value="frame-white" href="#" aria-label="흰색"></a>
    <a class="sw" data-group="frame" data-value="frame-black" href="#" aria-label="검정"></a>
    <a class="sw" data-group="frame" data-value="frame-blue"  href="#" aria-label="파랑"></a>
    <a class="sw" data-group="frame" data-value="frame-pink"  href="#" aria-label="분홍"></a>
    <a class="sw s-img" data-group="frame" data-value="frame-shingu" href="#" aria-label="신구"><img src="assets/frame-5.svg" alt=""></a>

    <p class="note">QR코드로 사진원본을 다운받을 수 있습니다.</p>

    <!-- NEXT 만 있다. 이 화면의 NEXT 는 검정(.nav-black)이며 다른 화면보다 14px 아래(y=797)에 있다 -->
    <a class="nav-btn nav-next nav-black" id="nav-next" href="../08_print_qr/index.html">NEXT</a>
  </main>
</body>
</html>
