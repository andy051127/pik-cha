<!-- 인화 상태 관리 화면. GET /admin/print-status로 세션 목록을 불러오고,
     재인쇄(/admin/print/reprint)·SMS 재발송(/admin/sms/resend) 버튼 제공. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인화 상태 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a href="../WaitingList_AdminPage/index.html" class="back-link">← 대시보드</a>
    <h1>인화 상태 관리</h1>
    <button type="button" class="refresh-btn" id="refreshBtn">새로고침</button>
  </div>

  <p class="status-msg" id="statusMsg"></p>

  <table class="print-table">
    <thead>
      <tr>
        <th>순번</th>
        <th>세션</th>
        <th>이름</th>
        <th>전화번호</th>
        <th>매수</th>
        <th>인쇄상태</th>
        <th>SMS</th>
        <th>생성시각</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="sessionsBody">
      <tr><td colspan="9" class="empty-row">불러오는 중...</td></tr>
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
