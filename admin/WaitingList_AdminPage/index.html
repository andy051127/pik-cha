<!-- 관리자 대시보드 허브 화면. 3개 카드(Dashboard/Waiting List/Print Status)로
     각 관리 화면 진입. Dashboard 카드의 대기팀 수는 공개 엔드포인트(/waitlist/count)로 폴링. -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Waiting List Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <img class="logo" src="../assets/logo-wordmark-green.png" alt="Pik-Cha!">
    <div class="topbar-right">
      <a href="../WaitingList_AdminTablet/index.html" class="qr-link">QR 페이지</a>
      <div class="admin-pill">
        <span class="admin-emoji" aria-hidden="true">😃</span>
        <span>관리자</span>
      </div>
    </div>
  </div>

  <div class="hero">
    <p class="hero-text">PHOTOBOOTH</p>
    <p class="hero-text">PHOTOBOOTH</p>
    <p class="hero-text">PHOTOBOOTH</p>
    <img class="hero-bubble" src="../assets/logo-bubble.png" alt="Pik-Cha!">
  </div>

  <div class="cards">
    <div class="card card-filled">
      <div class="card-label">01 | Dashboard</div>
      <div class="card-body">
        <p class="card-number"><span id="waitingCount">-</span>팀</p>
        <p class="card-caption">현재 대기중</p>
      </div>
    </div>

    <a class="card" href="../WaitingList_AdminManage/index.html">
      <div class="card-label">02 | Waiting List</div>
      <div class="card-body">
        <p class="card-title">웨이팅리스트 관리</p>
        <p class="card-caption card-caption-dark">대기팀 순번 호출 · 취소 처리</p>
      </div>
    </a>

    <a class="card" href="../PrintStatus_AdminManage/index.html">
      <div class="card-label">03 | Print Status</div>
      <div class="card-body">
        <p class="card-title">인화 상태 관리</p>
        <p class="card-caption card-caption-dark">완료 처리 · 호출</p>
      </div>
    </a>
  </div>

  <script src="script.js"></script>
</body>
</html>
